[workspace]
resolver = "2"
members = ["crates/blitzpkt-core", "crates/blitzpkt-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blitzpkt/blitzpkt"
rust-version = "1.75"

[workspace.dependencies]
smallvec = "1.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding is required: a Python extension module must not abort the host process.
