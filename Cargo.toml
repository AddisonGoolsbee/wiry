[workspace]
resolver = "2"
members = [
    "crates/wiry",
    "crates/wiry-core",
    "crates/wiry-capture",
    "crates/wiry-pcap",
    "crates/wiry-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/AddisonGoolsbee/wiry"
rust-version = "1.75"

[workspace.dependencies]
smallvec = "1.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding is required: a Python extension module must not abort the host process.
