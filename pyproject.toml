[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "blitzpkt"
description = "Fast packet dissection and crafting with a familiar API. Rust core, Python facade."
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/blitzpkt/blitzpkt"

[tool.maturin]
manifest-path = "crates/blitzpkt-py/Cargo.toml"
module-name = "blitzpkt._blitzpkt"
python-source = "python"
features = ["pyo3/extension-module"]
