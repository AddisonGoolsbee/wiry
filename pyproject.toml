[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "wiry"
description = "Fast packet dissection and crafting with a familiar API. Rust core, Python facade."
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
]
dynamic = ["version"]

# Dataframe exports and plotting. Never required to install or use the library.
[project.optional-dependencies]
arrow = ["pyarrow>=14"]
polars = ["polars>=0.20"]
pandas = ["pandas>=1.5"]
plot = ["matplotlib>=3.5"]

[project.urls]
Repository = "https://github.com/AddisonGoolsbee/wiry"

[tool.maturin]
manifest-path = "crates/wiry-py/Cargo.toml"
module-name = "wiry._wiry"
python-source = "python"
features = ["pyo3/extension-module"]
# Wheels pick these up automatically; the sdist does not, and a wheel built from
# a licence-less sdist would ship without one. GPL-2.0 §1 requires the copy.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]
