[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "packetry"
description = "Fast packet dissection and crafting with a familiar API. Rust core, Python facade."
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Networking :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

# Dataframe exports only. Never required to install or use the library.
[project.optional-dependencies]
arrow = ["pyarrow>=14"]
polars = ["polars>=0.20"]
pandas = ["pandas>=1.5"]

[project.urls]
Repository = "https://github.com/packetry/packetry"

[tool.maturin]
manifest-path = "crates/packetry-py/Cargo.toml"
module-name = "packetry._packetry"
python-source = "python"
features = ["pyo3/extension-module"]
