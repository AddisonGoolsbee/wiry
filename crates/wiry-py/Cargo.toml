[package]
name = "wiry-py"
description = "Python bindings for wiry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["packet", "pcap", "python", "pyo3", "scapy"]
categories = ["network-programming", "api-bindings"]
readme = "../../README.md"

[lib]
name = "_wiry"
crate-type = ["cdylib", "rlib"]

[dependencies]
wiry-core = { path = "../wiry-core", version = "0.1.0" }
wiry-capture = { path = "../wiry-capture", version = "0.1.0" }
# extension-module is NOT enabled here: it disables linking against libpython,
# which breaks `cargo test`/`cargo build`. maturin enables it at build time via
# pyproject.toml's [tool.maturin] features, which is the only place it matters.
pyo3 = { version = "0.22", features = ["abi3-py39"] }

[features]
# Forwards to the capture crate. Off by default: the offline paths never need it.
live = ["wiry-capture/live"]
