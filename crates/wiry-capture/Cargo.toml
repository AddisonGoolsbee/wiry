[package]
name = "wiry-capture"
description = "Live packet capture and injection for wiry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["packet", "pcap", "capture", "sniffer", "network"]
categories = ["network-programming"]
readme = "../../README.md"
rust-version.workspace = true

[dependencies]
wiry-core = { path = "../wiry-core", version = "0.1.0" }
# Pinned exactly: 2.5.0 declares MSRV 1.64 but master already declares 1.85 and
# edition 2024, so a 2.6 would break this workspace's MSRV on `cargo update`.
pcap = { version = "=2.5.0", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
# getifaddrs/AF_LINK, which this crate cannot reach itself: forbid(unsafe_code).
# Pinned for the same reason pcap is: it declares no MSRV of its own, so a minor
# bump of it or of its nix dependency could quietly raise this workspace's.
mac_address = { version = "=1.1.8", optional = true }

[features]
live = ["dep:pcap", "dep:socket2", "dep:mac_address"]
