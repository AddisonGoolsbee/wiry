[package]
name = "wiry-capture"
description = "Live packet capture and injection for wiry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["packet", "pcap", "capture", "sniffer", "network"]
categories = ["network-programming"]
readme = "../../README.md"
rust-version.workspace = true

[dependencies]
wiry-core = { path = "../wiry-core", version = "0.1.0" }
wiry-pcap = { path = "../wiry-pcap", version = "0.1.0", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
# getifaddrs/AF_LINK, which this crate cannot reach itself: forbid(unsafe_code).
# Pinned because it declares no MSRV of its own, so a minor bump of it or of its
# nix dependency could quietly raise this workspace's.
mac_address = { version = "=1.1.8", optional = true }

[features]
# On by default. Nothing here is needed at build time any more — libpcap is
# loaded when a capture is first asked for — so the only reason to turn it off
# is to drop the three dependencies.
default = ["live"]
live = ["dep:wiry-pcap", "dep:socket2", "dep:mac_address"]
