[package]
name = "blitzpkt-py"
description = "Python bindings for blitzpkt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_blitzpkt"
crate-type = ["cdylib", "rlib"]

[dependencies]
blitzpkt-core = { path = "../blitzpkt-core" }
# extension-module is NOT enabled here: it disables linking against libpython,
# which breaks `cargo test`/`cargo build`. maturin enables it at build time via
# pyproject.toml's [tool.maturin] features, which is the only place it matters.
pyo3 = { version = "0.22", features = ["abi3-py39"] }
