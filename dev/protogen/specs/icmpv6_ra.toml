name = "ICMPv6ND_RA"
id = "Icmpv6NdRa"
num = 49
citation = """
RFC 4861 §4.2, Router Advertisement: ICMPv6 type 134, code 0, checksum, a
one-octet current hop limit, the Managed and Other configuration flags, a
16-bit router lifetime in seconds, a 32-bit reachable time and a 32-bit
retransmit timer, both in milliseconds, then options (§4.6). The Home Agent bit
is RFC 6275 §7.1, the two Default Router Preference bits and the Proxy bit are
RFC 4191 §2.2 and RFC 4389 §4.1.
"""
