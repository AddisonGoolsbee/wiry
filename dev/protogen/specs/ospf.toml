name = "OSPF_Hdr"
id = "Ospf"
num = 59
module = "ospf"
citation = """
RFC 2328 §A.3.1: every OSPF version 2 packet opens with a one-octet version, a
one-octet type, a 16-bit packet length, the 32-bit router id, the 32-bit area
id, a 16-bit checksum, a 16-bit authentication type and 64 bits of
authentication data. §D.3 gives those 64 bits a structure when the
authentication type is 2 (Cryptographic): a reserved word, a key id, an
authentication data length and a 32-bit cryptographic sequence number, which is
why five of the fields here are conditional on `authtype`.

The five bodies of §A.3.2 to §A.3.6 are separate layers, reached from `type` as
scapy's `bind_layers(OSPF_Hdr, ..., type=n)` reaches them: OSPF_Hello,
OSPF_DBDesc, OSPF_LSReq, OSPF_LSUpd and OSPF_LSAck. The packet length bounds
them, so each body's repeating group simply runs to the end of what this header
admits.
"""
min_len = 24
header_len = 24
content_len = "hand"

[[fields]]
name = "version"
off = 0
len = 8
default = 2

[[fields]]
name = "type"
off = 8
len = 8
default = 1

[[fields]]
name = "len"
off = 16
len = 16
default = 24

[[fields]]
name = "src"
off = 32
kind = "ipv4"

[[fields]]
name = "area"
off = 64
kind = "ipv4"

[[fields]]
name = "chksum"
off = 96
len = 16

[[fields]]
name = "authtype"
off = 112
len = 16

[[fields]]
name = "authdata"
off = 128
len = 64
kind = "bytes"
when = "is_plain_auth"

[[fields]]
name = "reserved"
off = 128
len = 16
when = "is_crypto_auth"

[[fields]]
name = "keyid"
off = 144
len = 8
default = 1
when = "is_crypto_auth"

[[fields]]
name = "authdatalen"
off = 152
len = 8
when = "is_crypto_auth"

[[fields]]
name = "seq"
off = 160
len = 32
when = "is_crypto_auth"

[next]
off = 8
len = 8
fallback = "raw"

[[next.arms]]
value = 1
proto = "OspfHello"

[[next.arms]]
value = 2
proto = "OspfDbDesc"

[[next.arms]]
value = 3
proto = "OspfLsReq"

[[next.arms]]
value = 4
proto = "OspfLsUpd"

[[next.arms]]
value = 5
proto = "OspfLsAck"

[[parents]]
from = "ipproto"
values = [89]

[vector]
source = "RFC 2328 §A.3.2 hello, hand-built: router 10.0.0.1, area 0.0.0.0, length 24."
bytes = [
  0x02, 0x01, 0x00, 0x18,
  0x0a, 0x00, 0x00, 0x01,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
]
[vector.fields]
version = 2
type = 1
len = 24
chksum = 0
authtype = 0

