name = "Dot11Auth"
id = "Dot11Auth"
num = 42
citation = """
IEEE Std 802.11-2020 §9.3.3.12: the Authentication frame body is a 16-bit
Authentication Algorithm Number, a 16-bit Authentication Transaction Sequence
Number and a 16-bit Status Code, little-endian, followed by any information
elements the algorithm defines.
"""
min_len = 6
header_len = "rest"
next = "end"
parse_options = "hand"

[[fields]]
name = "algo"
off = 0
len = 16
kind = "le_uint"
enum = { 0 = "open", 1 = "sharedkey" }

[[fields]]
name = "seqnum"
off = 16
len = 16
kind = "le_uint"
default = 1

[[fields]]
name = "status"
off = 32
len = 16
kind = "le_uint"
[fields.enum]
0 = "success"
1 = "failure"
10 = "cannot-support-all-cap"
11 = "inexist-asso"
12 = "asso-denied"
13 = "algo-unsupported"
14 = "bad-seq-num"
15 = "challenge-failure"
16 = "timeout"
17 = "AP-full"
18 = "rate-unsupported"

[[fields]]
name = "options"
off = 48
kind = "var_bytes"

[vector]
source = "IEEE 802.11-2020 §9.3.3.12: open system, sequence 1, status 0."
bytes = [0x00, 0x00, 0x01, 0x00, 0x00, 0x00]
[vector.fields]
algo = 0
seqnum = 1
status = 0

[provenance]
source = "scapy/layers/dot11.py"
version = "scapy 2.7.0"
changed = ["2026-10-03 — enumerated names of algo, status transcribed"]
