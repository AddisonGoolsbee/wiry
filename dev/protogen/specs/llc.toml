name = "LLC"
id = "Llc"
num = 32
citation = """
IEEE Std 802.2-1998 (ISO/IEC 8802-2) §3.2: an LLC PDU opens with a one-octet
DSAP, a one-octet SSAP and a control field, taken here as the one-octet
unnumbered form that every protocol in scope uses. SAP values are IEEE 802
assignments: 0x42 spanning tree (IEEE 802.1D §9.3), 0xAA SNAP (RFC 1042),
0xF0 NetBIOS.
"""
min_len = 3
header_len = 3
next = "hand"
bind_next = "hand"

[[fields]]
name = "dsap"
off = 0
len = 8
default = 0xaa

[[fields]]
name = "ssap"
off = 8
len = 8
default = 0xaa

[[fields]]
name = "ctrl"
off = 16
len = 8
default = 3

[vector]
source = "IEEE 802.1D §7.12.3: a BPDU is carried with DSAP = SSAP = 0x42, UI control."
bytes = [0x42, 0x42, 0x03]
[vector.fields]
dsap = 0x42
ssap = 0x42
ctrl = 3
