module = "sflow"
citation = """
sFlow.org, "sFlow Version 5" (July 2004), §5.1 datagram format: a 32-bit
version (5), a 32-bit address type (1 IPv4, 2 IPv6), the agent address, a
32-bit sub-agent id, a 32-bit datagram sequence number, the 32-bit agent
uptime in milliseconds and a 32-bit sample count. Only the IPv4 agent-address
form has a fixed header length; the samples that follow are an XDR array and
stay in the payload (DEVIATIONS P3).
"""
