name = "HTTP"
id = "Http"
num = 82
parsed_field = "headers"
citation = """
RFC 9112 §2.1: an HTTP/1.x message is a start line, then field lines, then an
empty line, then an optional body. §3 gives the request line (method, request
target, HTTP version) and §4 the status line (version, status code, reason
phrase); RFC 9110 §5 gives the field lines, whose names are case-insensitive.
This is text, not a field table, so the start line and the field lines are
decoded into one named item list and the body is left as payload
(DEVIATIONS T1).
"""
