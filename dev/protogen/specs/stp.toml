name = "STP"
id = "Stp"
num = 34
citation = """
IEEE Std 802.1D-2004 §9.3.1, Configuration BPDU: protocol identifier (0x0000),
version, BPDU type, flags, root identifier (a two-octet priority and a
six-octet address), root path cost, bridge identifier, port identifier, and the
four timer values in 1/256-second units. §9.3.2 gives the four-octet
Topology Change Notification BPDU, which is why the minimum length is 4.
RSTP is version 2 of the same frame (IEEE 802.1D-2004 §17.2).
"""
