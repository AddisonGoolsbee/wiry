name = "NetflowHeaderV9"
id = "NetflowV9"
num = 76
module = "netflow9"
citation = """
RFC 3954 §5.1: a 16-bit version (9), a 16-bit count of FlowSets, the 32-bit
system uptime in milliseconds, the 32-bit UNIX export time, a 32-bit sequence
number and a 32-bit source id. §5.2 and §5.3 give every FlowSet the same two
leading fields — a 16-bit FlowSet id (0 template, 1 options, 256 and up data)
and a 16-bit length covering both of them and the records — so the FlowSets are
a repeating group whose element width is its own length field
(`crates/wiry-core/src/repeat.rs`), running to the end of the datagram.

The FlowSet *contents* are not decoded: a data FlowSet needs the template the
exporter sent in an earlier datagram, which is per-session state this dissector
does not keep (DEVIATIONS P6). The header's `count` is not used as the element
count either, because §5.1 defines it as the number of records across all
FlowSets rather than the number of FlowSets.
"""
min_len = 20
header_len = "rest"
build_len = 20
parsed_field = "flowsets"

[[fields]]
name = "version"
off = 0
len = 16
default = 9

[[fields]]
name = "count"
off = 16
len = 16

[[fields]]
name = "sysUptime"
off = 32
len = 32

[[fields]]
name = "unixSecs"
off = 64
len = 32

[[fields]]
name = "sequenceNumber"
off = 96
len = 32

[[fields]]
name = "SourceID"
off = 128
len = 32

[[fields]]
name = "flowsets"
off = 160
kind = "var_bytes"

[group]
name = "NetflowFlowsetV9"
start = 20
extent = "rest"
elem_base = 0
elem_min = 4

[[group.terms]]
off = 16
len = 16
scale = 1

[[group.fields]]
name = "flowSetID"
off = 0
len = 16

[[group.fields]]
name = "length"
off = 16
len = 16
default = 4

[[group.fields]]
name = "content"
off = 32
kind = "var_bytes"

[[parents]]
from = "udp_port"
values = [2055, 9995, 9996]
guard = "crate::layers::netflow9::looks_like"
bind = 2055

[vector]
source = "RFC 3954 §5.1 export header, hand-built: version 9, one FlowSet, uptime 1000 ms."
bytes = [
  0x00, 0x09, 0x00, 0x01,
  0x00, 0x00, 0x03, 0xe8,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x01,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x08, 0x01, 0x00, 0x00, 0x01,
]
[vector.fields]
version = 9
count = 1
sysUptime = 1000
unixSecs = 0
sequenceNumber = 1
SourceID = 0

[provenance]
source = "scapy/layers/netflow.py"
version = "scapy 2.7.0"
