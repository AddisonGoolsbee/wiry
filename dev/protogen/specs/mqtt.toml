name = "MQTT"
id = "Mqtt"
num = 84
citation = """
OASIS MQTT Version 3.1.1 §2.2: the fixed header is a four-bit control packet
type, a DUP flag, a two-bit QoS level and a RETAIN flag, followed by the
Remaining Length — a variable-length integer of one to four octets, seven bits
each with a continuation bit (§2.2.3). MQTT Version 5.0 §2.1.1 keeps the same
fixed header. The length is not at a fixed width, so it is decoded into the
item list rather than placed in the field table.
"""
min_len = 2
header_len = "hand"
build_len = 2
next = "raw"
parse_options = "hand"

[[fields]]
name = "type"
off = 0
len = 4
default = 1

[[fields]]
name = "DUP"
off = 4
len = 1

[[fields]]
name = "QOS"
off = 5
len = 2

[[fields]]
name = "RETAIN"
off = 7
len = 1

[[fields]]
name = "options"
off = 8
kind = "var_bytes"

[[parents]]
from = "tcp_port"
values = [1883, 8883]
guard = "crate::layers::mqtt::looks_like"
bind = 1883

[vector]
source = "OASIS MQTT 3.1.1 §3.12 PINGREQ: type 12, remaining length 0."
bytes = [0xc0, 0x00]
[vector.fields]
type = 12
DUP = 0
QOS = 0
RETAIN = 0
