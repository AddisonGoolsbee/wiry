name = "RTCP"
id = "Rtcp"
num = 74
citation = """
RFC 3550 §6.1: every RTCP packet opens with a two-bit version, a padding bit, a
five-bit item count whose meaning is per packet type, a one-octet packet type
(200 SR, 201 RR, 202 SDES, 203 BYE, 204 APP) and a 16-bit length in 32-bit
words minus one. The per-type bodies of §6.4 onwards stay opaque. Like RTP, no
port is bound by default.
"""
