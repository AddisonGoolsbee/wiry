name = "TLS"
id = "Tls"
num = 81
citation = """
RFC 8446 §5.1 (and RFC 5246 §6.2.1, which is the same shape): a TLS record is a
one-octet content type (20 change_cipher_spec, 21 alert, 22 handshake,
23 application_data), a two-octet legacy record version and a two-octet length.
§4.1.2 gives the ClientHello inside a handshake record: the legacy version, a
32-octet random, a session id, the cipher suites, the compression methods and
the extensions, from which §9.2 and RFC 6066 §3 name the server_name
extension. Only that chain is followed, because the server name is the field
worth reaching; everything else in the record stays bytes.
"""
min_len = 5
header_len = "hand"
build_len = 5
next = "raw"
parse_options = "hand"

