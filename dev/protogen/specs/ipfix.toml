name = "IPFIX"
id = "Ipfix"
num = 77
citation = """
RFC 7011 §3.1: a 16-bit version (10), a 16-bit length covering the whole
message, a 32-bit export time in seconds, a 32-bit sequence number and a 32-bit
observation domain id. The Sets that follow (§3.3) need the template the
exporter sent earlier, so they stay in the payload (DEVIATIONS P6).
"""
min_len = 16
header_len = 16
content_len = "hand"

