name = "Dot11Beacon"
id = "Dot11Beacon"
num = 39
citation = """
IEEE Std 802.11-2020 §9.3.3.3: the Beacon frame body opens with a 64-bit
Timestamp, a 16-bit Beacon Interval in time units and a 16-bit Capability
Information field, all little-endian, followed by information elements in the
§9.4.2.1 element format (a one-octet element id and a one-octet length).
"""
