name = "ICMPv6MLQuery"
id = "Icmpv6MlQuery"
num = 53
module = "mld_query"
citation = """
RFC 2710 §3, Multicast Listener Query: ICMPv6 type 130, code 0, checksum, a
16-bit Maximum Response Delay in milliseconds, a 16-bit reserved field and the
128-bit multicast address. RFC 3810 §5.1 extends the same 24 octets with a
reserved/S/QRV octet, a QQIC octet, a 16-bit source count and that many source
addresses; a query of at least 28 octets is a version 2 query, which is why
those four fields are conditional on the header length.
"""
