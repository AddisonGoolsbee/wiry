num = 87
parsed_field = "vars"
citation = """
RFC 4511 §4.1.1: an LDAPMessage is a BER SEQUENCE of a messageID INTEGER, a
context-tagged protocolOp choice (0 bindRequest, 1 bindResponse, 3 searchRequest,
4 searchResEntry, 5 searchResDone, and the rest of §4.2 onwards) and optional
controls. Encoding rules are ITU-T X.690 §8. There are no fixed offsets, so the
message is decoded into a named item list (DEVIATIONS T2).
"""
