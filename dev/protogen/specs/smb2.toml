name = "SMB2_Header"
id = "Smb2"
num = 86
module = "smb2"
citation = """
Microsoft Open Specifications, [MS-SMB2] §2.2.1.2: the SMB2 packet header is a
four-octet ProtocolId (0xFE 'S' 'M' 'B'), a 16-bit StructureSize of 64, a
16-bit CreditCharge, a 32-bit Status, a 16-bit Command, a 16-bit
CreditRequest/CreditResponse, a 32-bit Flags, a 32-bit NextCommand, a 64-bit
MessageId, a 32-bit Reserved, a 32-bit TreeId, a 64-bit SessionId and a
16-octet Signature. Every field but ProtocolId is little-endian.
"""
min_len = 64
header_len = 64
next = "raw"

