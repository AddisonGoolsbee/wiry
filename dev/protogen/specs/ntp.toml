name = "NTP"
id = "Ntp"
num = 65
citation = """
RFC 5905 §7.3: a two-bit leap indicator, a three-bit version, a three-bit mode,
a one-octet stratum, a one-octet poll exponent, a one-octet precision exponent,
the 32-bit root delay and root dispersion in NTP short format, the 32-bit
reference id, and the reference, origin, receive and transmit timestamps in
64-bit NTP timestamp format. Poll and precision are signed exponents on the
wire and are read unsigned here (DEVIATIONS P4).
"""
