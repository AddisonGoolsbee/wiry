name = "RTP"
id = "Rtp"
num = 73
citation = """
RFC 3550 §5.1: a two-bit version, a padding bit, an extension bit, a four-bit
CSRC count, a marker bit, a seven-bit payload type, a 16-bit sequence number, a
32-bit timestamp, a 32-bit synchronisation source identifier, then that many
32-bit contributing source identifiers — a count-driven repeating group
(`crates/wiry-core/src/repeat.rs`). §5.3.1's header extension follows the list
and is counted into the header, not decoded. RTP is negotiated out of band, so
no port is bound to it by default (DEVIATIONS P5).
"""
