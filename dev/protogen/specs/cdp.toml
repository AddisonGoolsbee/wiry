name = "CDP"
id = "Cdp"
num = 36
citation = """
Cisco Discovery Protocol version 2, as published by Cisco Systems in
"Cisco Discovery Protocol Configuration Guide" and the protocol description in
Cisco document 13418: a one-octet version, a one-octet time-to-live, a
two-octet checksum, then TLVs of a two-octet type and a two-octet length that
counts both header words. Carried over 802.2 SNAP with OUI 0x00000C and
protocol id 0x2000.
"""
min_len = 4
header_len = "rest"
next = "end"
parse_options = "hand"
parsed_field = "msg"

[[fields]]
name = "vers"
off = 0
len = 8
default = 2

[[fields]]
name = "ttl"
off = 8
len = 8
default = 180

[[fields]]
name = "cksum"
off = 16
len = 16

[[fields]]
name = "msg"
off = 32
kind = "var_bytes"

[vector]
source = "CDPv2 announcement, hand-built: version 2, TTL 180, one Device-ID TLV carrying \"r1\"."
bytes = [0x02, 0xb4, 0x00, 0x00, 0x00, 0x01, 0x00, 0x06, 0x72, 0x31]
[vector.fields]
