name = "NetflowHeaderV5"
id = "NetflowV5"
num = 75
module = "netflow5"
citation = """
Cisco Systems, "NetFlow Export Datagram Formats", version 5 header: a 16-bit
version (5), a 16-bit record count, the 32-bit system uptime in milliseconds,
the 32-bit UNIX seconds and nanoseconds of the export, a 32-bit flow sequence
number, a one-octet engine type, a one-octet engine id and a two-octet
sampling interval. The 48-octet flow records that follow are a fixed-size array
and stay in the payload (DEVIATIONS P3).
"""
min_len = 24
header_len = 24

[[fields]]
name = "version"
off = 0
len = 16
default = 5

[[fields]]
name = "count"
off = 16
len = 16

[[fields]]
name = "sysUptime"
off = 32
len = 32

[[fields]]
name = "unixSecs"
off = 64
len = 32

[[fields]]
name = "unixNanoSeconds"
off = 96
len = 32

[[fields]]
name = "flowSequence"
off = 128
len = 32

[[fields]]
name = "engineType"
off = 160
len = 8

[[fields]]
name = "engineID"
off = 168
len = 8

[[fields]]
name = "samplingInterval"
off = 176
len = 16

[[parents]]
from = "udp_port"
values = [2055, 9995, 9996]
guard = "crate::layers::netflow5::looks_like"
bind = 2055

[vector]
