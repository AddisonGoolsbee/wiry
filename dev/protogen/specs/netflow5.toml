bytes = [
  0x00, 0x05, 0x00, 0x01,
  0x00, 0x00, 0x03, 0xe8,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x00,
  0x00, 0x00, 0x00, 0x00,
]
