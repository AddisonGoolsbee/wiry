name = "VRRP"
id = "Vrrp"
num = 62
citation = """
RFC 3768 §5.1: a four-bit version, a four-bit type, a one-octet virtual router
id, a one-octet priority, a one-octet count of IP addresses, a one-octet
authentication type, a one-octet advertisement interval in seconds and a 16-bit
checksum, followed by that many addresses. RFC 5798 §5.1 keeps the layout for
version 3 but reads the two authentication octets as a reserved field and a
12-bit advertisement interval in centiseconds.
"""
