name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (default) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # No libpcap is installed anywhere in this job. That is the point: live
      # capture loads it at run time, so nothing in the build may need it.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace


  rust-no-live:
    name: rust (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nolive-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nolive-

      - name: cargo clippy (no live)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: cargo test (no live)
        run: cargo test --workspace --no-default-features

  msrv:
    name: msrv 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75

      # libloading and mac_address are pinned exactly because neither declares
      # an MSRV of its own; this job is what catches a bump.
      - name: cargo check
        run: cargo check --workspace

  python:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }} ${{ matrix.features && '(no live)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        features: ["", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-

      # Only the runtime package, and only on Linux: macOS ships libpcap and
      # Windows has none, which is the case the honest failure path is for.
      # No -dev package anywhere, because the build must not need one.
      - name: Install libpcap at run time only
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libpcap0.8

      - name: Install maturin and pytest
        run: pip install maturin pytest

      # `pip install .` rather than `maturin develop`, which needs a virtualenv
      # the runner does not have. Features are spelled out rather than passed
      # with -F alone, so this is correct whether maturin appends to or replaces
      # the features in pyproject.toml.
      - name: Build and install the extension module
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            MATURIN_PEP517_ARGS="--no-default-features --features pyo3/extension-module" pip install .
          else
            pip install .
          fi

      # From a directory that is not the repo root, so the import resolves to
      # the installed wheel rather than the ./python source tree. A broken
      # wheel otherwise passes by importing sources the wheel never shipped.
      - name: Check the installed wheel imports
        shell: bash
        run: cd "${{ runner.temp }}" && python -c "import wiry; print(wiry.__version__)"

      # Printed rather than asserted: whether libpcap is there is a property of
      # the runner, and the suite covers both answers.
      - name: Say what the capture backend is
        shell: bash
        run: cd "${{ runner.temp }}" && python -c "import wiry; print(wiry.capture_backend())"

      - name: Run Python tests
        shell: bash
        run: pytest tests/ -q

      - name: Run the README's own examples
        shell: bash
        run: python dev/readme_examples.py
