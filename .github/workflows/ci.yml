name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace


  rust-live:
    name: rust (live) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install libpcap
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-live-

      # Package-qualified: the workspace root is virtual, so a bare --features
      # cannot name a member's feature.
      - name: cargo clippy (live)
        run: cargo clippy --workspace --all-targets --features wiry-py/live -- -D warnings

      - name: cargo test (live)
        run: cargo test --workspace --features wiry-py/live

  msrv:
    name: msrv 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.75

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # The pcap crate is pinned exactly because its master branch already
      # declares a much newer MSRV; this job is what catches a bump.
      - name: cargo check (live)
        run: cargo check --workspace --features wiry-py/live

  python:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }} ${{ matrix.features && '(live)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        features: ["", "live"]
        exclude:
          # Windows has no libpcap; the stub is what ships there.
          - os: windows-latest
            features: "live"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-

      - name: Install libpcap
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'live'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install maturin and pytest
        run: pip install maturin pytest

      # `pip install .` rather than `maturin develop`, which needs a virtualenv
      # the runner does not have. Features are spelled out rather than passed
      # with -F alone, so this is correct whether maturin appends to or replaces
      # the features in pyproject.toml.
      - name: Build and install the extension module
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            MATURIN_PEP517_ARGS="--features pyo3/extension-module,live" pip install .
          else
            pip install .
          fi

      # From a directory that is not the repo root, so the import resolves to
      # the installed wheel rather than the ./python source tree. A broken
      # wheel otherwise passes by importing sources the wheel never shipped.
      - name: Check the installed wheel imports
        shell: bash
        run: cd "${{ runner.temp }}" && python -c "import wiry; print(wiry.__version__)"

      - name: Run Python tests
        shell: bash
        run: pytest tests/ -q

      - name: Run the README's own examples
        shell: bash
        run: python dev/readme_examples.py
